name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Fenêtres du lecteur dans l'appli + confirmation de sortie
        run: |
          mkdir -p android/app/src/main/java/com/hescheck/app
          cat > android/app/src/main/java/com/hescheck/app/MainActivity.java <<'EOF'
          package com.hescheck.app;

          import android.app.AlertDialog;
          import android.app.DownloadManager;
          import android.content.DialogInterface;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Message;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.os.Handler;
          import android.os.Looper;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
            private static final String CHANNEL_URL = "https://whatsapp.com/channel/0029Vb7Ibg5002T79MWH2r1p";
            private FrameLayout layer;
            private WebView popup;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              final WebView wv = getBridge().getWebView();
              WebSettings s = wv.getSettings();
              s.setSupportMultipleWindows(true);
              s.setJavaScriptCanOpenWindowsAutomatically(true);
              wv.setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                @Override
                public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                  WebView pw = openPopup();
                  WebView.WebViewTransport t = (WebView.WebViewTransport) resultMsg.obj;
                  t.setWebView(pw);
                  resultMsg.sendToTarget();
                  return true;
                }
              });
              wv.setDownloadListener(new DownloadListener() {
                @Override
                public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                  try {
                    DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                    if (mimetype != null) {
                      r.setMimeType(mimetype);
                    }
                    String cookies = CookieManager.getInstance().getCookie(url);
                    if (cookies != null) {
                      r.addRequestHeader("cookie", cookies);
                    }
                    if (userAgent != null) {
                      r.addRequestHeader("User-Agent", userAgent);
                    }
                    r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                    r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, URLUtil.guessFileName(url, contentDisposition, mimetype));
                    DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                    dm.enqueue(r);
                    Toast.makeText(MainActivity.this, "T\u00e9l\u00e9chargement d\u00e9marr\u00e9\u2026", Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                    openExternal(url);
                  }
                }
              });
              getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                @Override
                public void handleOnBackPressed() {
                  if (popup != null) {
                    closePopup();
                  } else if (wv.canGoBack()) {
                    wv.goBack();
                  } else {
                    confirmExit();
                  }
                }
              });
              /* Autofill : lecture native du presse-papiers, reservee au site check-hes */
              wv.addJavascriptInterface(new Object() {
                @JavascriptInterface
                public String read() {
                  final String[] res = { "" };
                  final CountDownLatch l = new CountDownLatch(1);
                  runOnUiThread(new Runnable() {
                    @Override
                    public void run() {
                      try {
                        String u = wv.getUrl();
                        if (u != null && u.startsWith("https://check-hes.vercel.app")) {
                          ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                          if (cm != null && cm.hasPrimaryClip() && cm.getPrimaryClip() != null && cm.getPrimaryClip().getItemCount() > 0) {
                            CharSequence c = cm.getPrimaryClip().getItemAt(0).coerceToText(MainActivity.this);
                            if (c != null) {
                              res[0] = c.toString();
                            }
                          }
                        }
                      } catch (Exception e) {
                      }
                      l.countDown();
                    }
                  });
                  try {
                    l.await(2, TimeUnit.SECONDS);
                  } catch (Exception e) {
                  }
                  return res[0];
                }
              }, "HesClip");
              injectClip(wv);
              showFollowGate();
            }

            /* Branche Capacitor.Plugins.Clipboard (utilise par le site) sur la lecture native, tant que la page check-hes est affichee */
            private final Handler hnd = new Handler(Looper.getMainLooper());

            private void injectClip(final WebView wv) {
              try {
                String u = wv.getUrl();
                if (u != null && u.startsWith("https://check-hes.vercel.app")) {
                  wv.evaluateJavascript("(function(){try{window.Capacitor=window.Capacitor||{};var P=window.Capacitor.Plugins=window.Capacitor.Plugins||{};if(!P.Clipboard||!P.Clipboard.__hes){P.Clipboard={__hes:1,read:function(){return Promise.resolve({value:window.HesClip?window.HesClip.read():''})}}}}catch(e){}})();", null);
                }
              } catch (Exception e) {
              }
              hnd.postDelayed(new Runnable() {
                @Override
                public void run() {
                  injectClip(wv);
                }
              }, 1000);
            }

            /* Premier lancement : fenetre bloquante, bouton S'abonner au style "Ajouter maintenant" (en plus petit) */
            private void showFollowGate() {
              final SharedPreferences sp = getSharedPreferences("hes_prefs", MODE_PRIVATE);
              if (sp.getBoolean("wa_follow", false)) {
                return;
              }
              float d = getResources().getDisplayMetrics().density;
              LinearLayout box = new LinearLayout(this);
              box.setOrientation(LinearLayout.VERTICAL);
              int pad = (int) (24 * d);
              box.setPadding(pad, (int) (28 * d), pad, (int) (24 * d));
              GradientDrawable bg = new GradientDrawable();
              bg.setColor(0xFF0B0D1F);
              bg.setCornerRadius(20 * d);
              box.setBackground(bg);
              TextView t = new TextView(this);
              t.setText("Abonne-toi \u00e0 la cha\u00eene WhatsApp");
              t.setTextColor(Color.WHITE);
              t.setTextSize(20);
              t.setTypeface(Typeface.DEFAULT_BOLD);
              t.setGravity(Gravity.CENTER);
              box.addView(t, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
              TextView m = new TextView(this);
              m.setText("Avant de continuer, abonne-toi \u00e0 notre cha\u00eene WhatsApp, puis appuie sur le bouton.");
              m.setTextColor(0xFFB8BCD0);
              m.setTextSize(15);
              m.setGravity(Gravity.CENTER);
              LinearLayout.LayoutParams mp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
              mp.topMargin = (int) (12 * d);
              box.addView(m, mp);
              final AlertDialog[] holder = new AlertDialog[1];
              TextView b = new TextView(this);
              b.setText("S\u2019abonner");
              b.setTextColor(0xFF07140F);
              b.setTextSize(16);
              b.setTypeface(Typeface.DEFAULT_BOLD);
              b.setGravity(Gravity.CENTER);
              GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, new int[] { 0xFF1B7F8C, 0xFF2FAE5B });
              g.setCornerRadius(10 * d);
              b.setBackground(g);
              b.setOnClickListener(new View.OnClickListener() {
                @Override
                public void onClick(View v) {
                  sp.edit().putBoolean("wa_follow", true).apply();
                  openExternal(CHANNEL_URL);
                  if (holder[0] != null) {
                    holder[0].dismiss();
                  }
                }
              });
              LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams((int) (200 * d), (int) (44 * d));
              bp.topMargin = (int) (22 * d);
              bp.gravity = Gravity.CENTER_HORIZONTAL;
              box.addView(b, bp);
              AlertDialog dlg = new AlertDialog.Builder(this).setView(box).setCancelable(false).create();
              holder[0] = dlg;
              dlg.setCanceledOnTouchOutside(false);
              dlg.show();
              if (dlg.getWindow() != null) {
                dlg.getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
              }
            }

            private WebView openPopup() {
              closePopup();
              float d = getResources().getDisplayMetrics().density;
              popup = new WebView(this);
              WebSettings ps = popup.getSettings();
              ps.setJavaScriptEnabled(true);
              ps.setDomStorageEnabled(true);
              popup.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  String u = r.getUrl().toString();
                  if (u.startsWith("http://") || u.startsWith("https://")) {
                    return false;
                  }
                  openNative(u);
                  return true;
                }
              });
              popup.setWebChromeClient(new WebChromeClient() {
                @Override
                public void onCloseWindow(WebView w) {
                  closePopup();
                }
              });
              layer = new FrameLayout(this);
              layer.setBackgroundColor(Color.BLACK);
              layer.setClickable(true);
              layer.addView(popup, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              TextView x = new TextView(this);
              x.setText("\u2715");
              x.setTextColor(Color.WHITE);
              x.setTextSize(22);
              x.setGravity(Gravity.CENTER);
              x.setBackgroundColor(0x99000000);
              x.setOnClickListener(new View.OnClickListener() {
                @Override
                public void onClick(View v) {
                  closePopup();
                }
              });
              int size = (int) (44 * d);
              FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(size, size, Gravity.TOP | Gravity.END);
              lp.setMargins(0, (int) (12 * d), (int) (12 * d), 0);
              layer.addView(x, lp);
              addContentView(layer, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              return popup;
            }

            private void closePopup() {
              if (layer != null) {
                layer.removeAllViews();
                ViewGroup p = (ViewGroup) layer.getParent();
                if (p != null) {
                  p.removeView(layer);
                }
                layer = null;
              }
              if (popup != null) {
                popup.stopLoading();
                popup.destroy();
                popup = null;
              }
            }

            private void confirmExit() {
              new AlertDialog.Builder(this)
                .setTitle("Quitter H\u2019ES CHECK ?")
                .setMessage("Veux-tu vraiment fermer l'application ?")
                .setNegativeButton("Rester", null)
                .setPositiveButton("Quitter", new DialogInterface.OnClickListener() {
                  @Override
                  public void onClick(DialogInterface dialog, int which) {
                    finish();
                  }
                })
                .show();
            }

            /* Ouvre un lien : web = dans l'appli (fenetre interne), whatsapp/tg/autres = appli native */
            void openExternal(String url) {
              try {
                if (url.startsWith("http://") || url.startsWith("https://")) {
                  if (url.contains("whatsapp.com") || url.contains("wa.me")) {
                    openWhatsApp(url);
                    return;
                  }
                  if (url.contains("t.me/")) {
                    openNative(url);
                    return;
                  }
                  WebView pw = openPopup();
                  pw.loadUrl(url);
                  return;
                }
                openNative(url);
              } catch (Exception e) {
              }
            }

            /* WhatsApp : ouvre directement dans l'appli, Android propose WhatsApp / WhatsApp Business si les deux sont installes */
            void openWhatsApp(String url) {
              try {
                Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                Intent c = Intent.createChooser(i, "Ouvrir avec");
                c.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(c);
              } catch (Exception e) {
                openNative(url);
              }
            }

            void openNative(String url) {
              try {
                Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(i);
              } catch (Exception e) {
              }
            }
          }
          EOF

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HESCHECK.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HESCHECK-apk
          path: HESCHECK.apk

      - name: Publier dans Releases (lien de téléchargement direct)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HESCHECK.apk --title "HES CHECK APK" --notes "Dernière version de l'APK"
