<style>
:root{--tx:#eef0ff;--mut:#8a8fb0;--ln:#2a2650;--ok:#3ddc97;--bad:#ff6b81;--warn:#ffb454}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#050612}
body{color:var(--tx);font:300 14px/1.4 'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(120% 80% at 50% 0,#0a4aa0 0,#062a63 38%,#050a1f 100%) center/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(#0008,#0006 40%,#000b)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:400px;margin:0 auto;padding:max(34px,env(safe-area-inset-top)) 34px 8px}
.card{position:relative;border-radius:32px;border:1px solid #ffffff14;background:linear-gradient(#0a0b1cd9,#04050fe6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:16px 14px 14px;box-shadow:0 20px 60px #0009}
.top{display:flex;align-items:center;justify-content:flex-end;gap:10px;position:relative}
.orn{letter-spacing:.35em;color:#a9aed3;font-size:14px;padding-left:.35em}
.ib{width:36px;height:36px;border:0;border-radius:50%;background:none;color:#e9ebff;display:grid;place-items:center;cursor:pointer}
.ib:active{background:#ffffff14}.ib svg{width:22px;height:22px;fill:currentColor}
.jp{text-align:center;color:#565b82;letter-spacing:.3em;font-size:11px;margin:2px 0 14px;padding-left:.35em}
.panel{border:1px solid #1d1f3f;border-radius:24px;padding:12px 11px 11px;background:#02030a66}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:11px;border:1px solid #23264a;background:#0b0c1ecc;color:#8f94b8;font:300 12px inherit;cursor:pointer}
.row{display:flex;gap:9px;margin-top:12px}
.fld{height:48px;border-radius:17px;border:1.5px solid #2f2766;background:#07061a;color:var(--tx);font:300 18px inherit;outline:0}
.at{width:62px;display:grid;place-items:center;flex:none}
input.fld{flex:1;min-width:0;padding:0 15px;letter-spacing:.02em}
input.fld::placeholder{color:#6f7194}input.fld:focus{border-color:#6a58d6}
.out{margin-top:14px}
.ban{display:flex;align-items:center;justify-content:center;position:relative;min-height:54px;border-radius:18px;border:1px solid;font:400 16px inherit;letter-spacing:.04em;animation:in .3s ease}
.ban .cp{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:inherit;display:grid;place-items:center;cursor:pointer;opacity:.9}
.ban .cp svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.ban span{padding:0 42px}
.ban.ok{color:var(--ok);background:linear-gradient(#0d2a1f,#07140f);border-color:#1e5a41}
.ban.bad{color:var(--bad);background:linear-gradient(#2d0f18,#14070b);border-color:#6b2230}
.ban.warn{color:var(--warn);background:linear-gradient(#2d2009,#150f05);border-color:#6b4d1d}
.ban.nf{color:#b6b9d6;background:linear-gradient(#1a1b2c,#0d0e18);border-color:#363955}
.tbl{margin-top:10px;border:1px solid #1d1f3f;border-radius:18px;overflow:hidden;background:#07081a99;animation:in .35s ease}
.r{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 13px;border-bottom:1px solid #151733;min-height:40px}
.r:last-of-type{border-bottom:0}
.r .k{color:#9a9fc2;font-size:13px;flex:none}.r .v{text-align:right;font-size:13px;word-break:break-word}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px!important;letter-spacing:.05em}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;border:1px solid;font-weight:600;font-size:12px}
.pill.bad{color:var(--bad);border-color:#6b2230;background:#2a0f16}
.pill.warn{color:var(--warn);border-color:#6b4d1d;background:#2a1d08}
.pill.ok{color:var(--ok);border-color:#1e5a41;background:#0a2419}
.pill.nf{color:#b6b9d6;border-color:#363955;background:#15162a}
.note{margin:9px;padding:11px 12px;border-radius:14px;border:1px solid;display:flex;gap:9px;font-size:13px}
.note b{display:block;font-weight:600;font-size:13.5px}.note small{display:block;margin-top:2px;font-size:11.5px;opacity:.75;font-weight:300}
.note.bad{color:var(--bad);border-color:#5a1d29;background:#240d13}
.note.warn{color:var(--warn);border-color:#5a4118;background:#241a08}
.note.ok{color:var(--ok);border-color:#1b4d38;background:#091d15}
.go{display:block;width:100%;height:48px;margin-top:14px;border-radius:17px;border:1px solid #2c2f55;background:#04050f;color:var(--tx);font:500 14px inherit;letter-spacing:.24em;cursor:pointer}
.go:active{background:#0c0d22}.go:disabled{opacity:.55}
.go i{font-style:normal;color:#8f94b8;margin:0 8px}
.err{margin-top:14px;text-align:center;color:var(--bad);font-size:13px;animation:in .2s}
footer{text-align:center;color:#8a8fb0;letter-spacing:.1em;font-size:13px;padding:10px 0 max(16px,env(safe-area-inset-bottom))}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ic{width:1.05em;height:1.05em;vertical-align:-.16em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu .ic{width:18px;height:18px}.note>.ic{width:20px;height:20px;margin-top:1px}
.menu,.hist{position:absolute;z-index:5;right:14px;top:50px;min-width:200px;border-radius:16px;border:1px solid #2a2d52;background:#0a0b1ef5;box-shadow:0 14px 40px #000b;padding:6px}
.menu[hidden],.hist[hidden]{display:none}
.menu button,.hist button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;color:var(--tx);padding:10px 12px;border-radius:11px;font:300 14px inherit;cursor:pointer}
.menu button:active,.hist button:active{background:#ffffff14}
.hist{left:14px;right:14px;max-height:280px;overflow:auto}
.hist .e{justify-content:space-between}.hist .e em{font-style:normal;font-size:12px}
.hist p{margin:0;padding:14px;color:var(--mut);text-align:center}
#bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pal{position:absolute;z-index:5;right:14px;top:50px;width:236px;border-radius:16px;border:1px solid #2a2d52;background:#0a0b1ef5;box-shadow:0 14px 40px #000b;padding:14px}
.pal[hidden]{display:none}
.pal b{display:block;font-weight:400;font-size:13px;color:var(--mut);margin-bottom:10px}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid #ffffff30;cursor:pointer;padding:0}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px #0008 inset}
.pal label{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--mut)}
.pal input[type=color]{width:44px;height:30px;border:0;border-radius:8px;background:none;padding:0}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#14163a;border:1px solid #2f3270;color:var(--tx);padding:11px 20px;border-radius:999px;font-size:15px;z-index:9;animation:in .2s}

:root{--ac:#6a58d6}
.card{border-color:color-mix(in srgb,var(--ac) 30%,#0000);background:linear-gradient(color-mix(in srgb,color-mix(in srgb,var(--ac) 7%,#0a0b1c) 85%,transparent),color-mix(in srgb,color-mix(in srgb,var(--ac) 4%,#04050f) 90%,transparent))}
.panel,.tbl{border-color:color-mix(in srgb,var(--ac) 28%,#000)}
.r{border-bottom-color:color-mix(in srgb,var(--ac) 20%,#000)}
.chip{border-color:color-mix(in srgb,var(--ac) 32%,#000)}
.fld{border-color:color-mix(in srgb,var(--ac) 45%,#000);background:color-mix(in srgb,var(--ac) 9%,#000)}
input.fld:focus{border-color:color-mix(in srgb,var(--ac) 88%,#fff)}
.go{border-color:color-mix(in srgb,var(--ac) 40%,#000)}.go:active{background:color-mix(in srgb,var(--ac) 18%,#000)}
.menu,.hist,.pal{border-color:color-mix(in srgb,var(--ac) 35%,#000)}
.md{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:34px;background:#000b}
.md[hidden]{display:none}
.mc{width:100%;max-width:292px;border-radius:28px;background:#fff;color:#111;padding:22px 20px 20px;text-align:center;box-shadow:0 18px 50px #000a;animation:in .25s ease}
.mc h3{margin:2px 0 10px;font:700 19px/1.2 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0b0b0b}
.mc p{margin:0;font:400 13.5px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#444}
.mc .ar{display:block;margin:8px auto 14px;width:22px;height:22px;color:#f5b800;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mc .mb{display:block;width:100%;height:44px;border:0;border-radius:999px;background:#1673e0;color:#fff;font:700 16px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;box-shadow:0 5px 14px #1673e055;cursor:pointer}
.mc .mb:active{background:#125fba}
.mc .ms{display:block;width:100%;height:36px;margin-top:8px;border:0;background:none;color:#777;font:500 13.5px system-ui,sans-serif;cursor:pointer}
.toast{background:color-mix(in srgb,var(--ac) 22%,#000);border-color:color-mix(in srgb,var(--ac) 50%,#000)}
.jp{color:color-mix(in srgb,var(--ac) 45%,#6b6f90)}
</style>
</head>

 </div>

const IC={ban:'<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/>',q:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.9M12 17v.01"/>',image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/>',reset:'<path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',palette:'<path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.6 0-1.3-1-1.6-1-2.7 0-.9.7-1.5 1.6-1.5H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/>',install:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',expand:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',clip:'<rect x="6" y="4" width="12" height="17" rx="2.5"/><path d="M9 4h6v3H9z"/>'};

 img.onerror=()=>{URL.revokeObjectURL(url);toast(t.bgBad)}; img.src=url};

/* ---- couleur de l'interface ---- */
const COLS=['#6a58d6','#1e88e5','#14b8c4','#22c55e','#ec4899','#ef4444','#f59e0b','#cfd3e6','#a855f7','#f97316'];
function setAc(c,save){document.documentElement.style.setProperty('--ac',c);$('#cc').value=c;
 document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));if(save)store.set('hesAc',c)}
$('#sw').innerHTML=COLS.map(c=>`<button data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');
$('#sw').onclick=e=>{const b=e.target.closest('button');if(b)setAc(b.dataset.c,true)};
$('#cc').oninput=e=>setAc(e.target.value,true);
setAc(store.get('hesAc','#6a58d6'));

/* ---- menus ---- */
const menu=$('#menu'),hist=$('#hist'),pal=$('#pal');
const closeAll=()=>{menu.hidden=hist.hidden=pal.hidden=true};
$('#mb').onclick=e=>{e.stopPropagation();const o=menu.hidden;closeAll();menu.hidden=!o};
$('#hb').onclick=e=>{e.stopPropagation();const o=hist.hidden;closeAll();if(o){drawHist();hist.hidden=false}};
document.addEventListener('click',e=>{if(!e.target.closest('.menu,.hist,.pal'))closeAll()});
$('#mbg').onclick=()=>{closeAll();$('#file').click()};
$('#mcl').onclick=e=>{e.stopPropagation();closeAll();pal.hidden=false};
$('#mrs').onclick=()=>{closeAll();store.del('hesBg');setBg('');idbDel('vid');clearVideo();store.del('hesAc');setAc('#6a58d6')};
$('#mch').onclick=()=>{closeAll();store.del('hesHist')};
const ICON={ban:ic('ban'),sus:ic('clock'),ok:ic('check'),nf:ic('q')};
function drawHist(){const h=store.get('hesHist',[]);hist.innerHTML=h.length?h.map(x=>`<button class="e" data-u="${esc(x.u)}"><span>@${esc(x.u)}</span><em>${ICON[x.s]||''} ${fd(x.ts)}</em></button>`).join(''):`<p>${t.hist0}</p>`;
 hist.querySelectorAll('.e').forEach(b=>b.onclick=()=>{closeAll();$('#u').value=b.dataset.u;check(b.dataset.u)})}
function pushHist(u,s){const h=store.get('hesHist',[]).filter(x=>x.u!==u);h.unshift({u,s,ts:Date.now()});store.set('hesHist',h.slice(0,20))}

/* ---- Autofill : colle le pseudo depuis le presse-papiers (sinon le dernier pseudo cherché) ---- */
const okName=v=>/^[a-z0-9_.-]{3,20}$/.test(v);
const clean=v=>String(v).trim().replace(/^@/,'').toLowerCase();
async function pasteName(){   // → {v} si OK, sinon {e:'code'} pour dire POURQUOI ça ne marche pas
 const NC=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Clipboard;   // dans l'APK : presse-papiers natif, sans blocage
 if(NC){try{const x=clean((await NC.read()).value||'');return x?okName(x)?{v:x}:{e:'eInv'}:{e:'eEmp'}}catch{return{e:'eUns'}}}
 if(!window.isSecureContext)return{e:'eHttp'};
 if(!navigator.clipboard||!navigator.clipboard.readText)return{e:'eUns'};
 try{const x=clean(await navigator.clipboard.readText());return x?okName(x)?{v:x}:{e:'eInv'}:{e:'eEmp'}}
 catch(err){return{e:/NotAllowed|Security/.test(err&&err.name)?'eDen':'eUns'}}}
async function autofill(){const r=await pasteName();
 if(r.v){$('#u').value=r.v;return check(r.v)}
 toast(t[r.e]);if(r.e!=='eInv'&&r.e!=='eEmp')$('#u').focus()}
$('#af').onclick=autofill;
/* Collage manuel (appui long > Coller) : nettoie le pseudo et lance la vérification */
$('#u').addEventListener('paste',()=>setTimeout(()=>{const v=clean($('#u').value);$('#u').value=v;if(okName(v))check(v)},0));
$('#u').addEventListener('input',()=>{const v=$('#u').value,c=v.replace(/^@/,'').toLowerCase();if(c!==v)$('#u').value=c});
/* ---- fenêtre claire (style « Update Now ») ---- */
function ask(o){const m=$('#md'),b=$('#mbtn'),k=$('#msk');$('#mt').textContent=o.title;$('#mp').textContent=o.text;b.textContent=o.btn;
 k.hidden=!o.skip;k.textContent=o.skip||'';m.hidden=false;
 b.onclick=()=>{m.hidden=true;o.ok&&o.ok()};k.onclick=()=>{m.hidden=true;o.no&&o.no()}}
const CHANNEL='https://whatsapp.com/channel/0029Vb7Ibg5002T79MWH2r1p';
const HAS_NC=()=>!!(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Clipboard);
/* 1) abonnement obligatoire au premier lancement (se ferme seulement après un appui sur le bouton) */
function followGate(){if(store.get('hesFollow',''))return clipGate();
 ask({title:t.fTitle,text:t.fText,btn:t.fBtn,ok:()=>{store.set('hesFollow','1');window.open(CHANNEL,'_blank','noopener');setTimeout(clipGate,700)}})}
/* 2) autorisation du presse-papiers (le navigateur n'affiche sa demande qu'après un appui) */
async function clipGate(){
 if(store.get('hesClip','')||HAS_NC())return;
 try{const p=await navigator.permissions.query({name:'clipboard-read'});if(p.state!=='prompt'){store.set('hesClip','1');return}}catch{}
 if(!navigator.clipboard||!navigator.clipboard.readText){store.set('hesClip','1');return}
 ask({title:t.gTitle,text:t.gText,btn:t.gOk,skip:t.gNo,
  no:()=>store.set('hesClip','no'),
  ok:async()=>{store.set('hesClip','1');const r=await pasteName();if(r.v){$('#u').value=r.v;check(r.v)}else if(r.e!=='eInv'&&r.e!=='eEmp')toast(t[r.e])}})}

/* ---- mode « appli » dans le navigateur : installation (PWA) + plein écran ---- */
const STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true||!!window.Capacitor;
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});
if(!STANDALONE){$('#min').hidden=false;if(document.fullscreenEnabled)$('#mfs').hidden=false}
$('#min').onclick=()=>{closeAll();if(dip){dip.prompt();dip=null}else ask({title:t.insTitle,text:t.insText,btn:t.insBtn})};
async function goFs(){try{await document.documentElement.requestFullscreen({navigationUI:'hide'});store.set('hesFs',1)}catch{toast(t.fsBad)}}
$('#mfs').onclick=()=>{closeAll();if(document.fullscreenElement){document.exitFullscreen();store.set('hesFs',0)}else goFs()};
if(!STANDALONE&&store.get('hesFs',0))document.addEventListener('pointerdown',()=>{if(!document.fullscreenElement)goFs()},{once:true});
if('serviceWorker' in navigator&&!window.Capacitor&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
followGate();

/* ---- vérification ---- */
const left=ms=>{let s=Math.max(0,Math.round(ms/60000)),d=Math.floor(s/1440),h=Math.floor(s%1440/60),m=s%60;return d?`${d}${t.d} ${h}${t.h}`:h?`${h}${t.h} ${m}${t.m}`:`${Math.max(m,1)}${t.m}`};
const COPY='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>';
const row=(k,v,c)=>`<div class="r"><span class="k">${k}</span><span class="v${c?' '+c:''}">${v}</span></div>`;
function show(d){
 const u=d.user;let cls,label,s,rows,note,txt;
 if(d.status==='banned'){cls='bad';s='ban';label=t.ban;
  rows=row(t.user,'@'+esc(u),'mono')+row(t.type,`<span class="pill bad">${ic('ban')} ${t.perma}</span>`)+row(t.viol,esc(d.reason||t.unk))+row(t.at,d.since?fd(d.since):t.none,'mono')+row(t.ret,t.never);
  note=`<div class="note bad">${ic('ban')}<div><b>${t.npb}</b><small>${t.npbp}</small></div></div>`;txt=`@${u} — ${t.ban} — ${d.reason||t.unk}`}
 else if(d.status==='suspended'){cls='warn';s='sus';label=t.sus;
  rows=row(t.user,'@'+esc(u),'mono')+row(t.type,`<span class="pill warn">${ic('clock')} ${t.susT}</span>`)+row(t.viol,esc(d.reason||'spam'))+row(t.at,d.since?fd(d.since):t.none,'mono')+row(t.ret,fd(d.until),'mono');
  note=`<div class="note warn">${ic('clock')}<div><b>${t.nsu}</b><small>${t.nsup}${left(d.until-Date.now())}</small></div></div>`;txt=`@${u} — ${t.sus} → ${fd(d.until)}`}
 else if(d.status==='active'){cls='ok';s='ok';label=t.clean;
  rows=row(t.user,'@'+esc(u),'mono')+row(t.type,`<span class="pill ok">${ic('check')} ${t.okT}</span>`);
  note=`<div class="note ok">${ic('check')}<div><b>${t.nban}</b><small>${t.nbanp}</small></div></div>`;txt=`@${u} — ${t.clean}`}
 else{cls='nf';s='nf';label=t.nf;
  rows=row(t.user,'@'+esc(u),'mono')+row(t.type,`<span class="pill nf">${ic('q')} ${t.nfT}</span>`);
  note=`<div class="note" style="color:#b6b9d6;border-color:#363955;background:#12131f">${ic('q')}<div><b>${t.nnf}</b><small>${t.nnfp}</small></div></div>`;txt=`@${u} — ${t.nf}`}
 $('#out').innerHTML=`<div class="ban ${cls}"><span>${label}</span><button class="cp" aria-label="Copy">${COPY}</button></div><div class="tbl">${rows}${note}</div>`;
 $('#out .cp').onclick=()=>{navigator.clipboard?.writeText(txt).then(()=>toast(t.copied),()=>{})};
 pushHist(u,s)}
async function check(name){
 const out=$('#out'),b=$('#go');out.innerHTML='';b.disabled=true;
 try{const r=await fetch(API+'/api/checkban?u='+encodeURIComponent(name)),d=await r.json().catch(()=>({}));
  if(r.status===429)out.innerHTML=`<div class="err">${t.many}</div>`;
  else if(r.status===400)out.innerHTML=`<div class="err">${t.bad}</div>`;
  else if(!r.ok)throw 0;else show(d)}
 catch{out.innerHTML=`<div class="err">${t.net}</div>`}
 b.disabled=false}
const run=()=>{const v=$('#u').value.trim().replace(/^@/,'').toLowerCase();if(v){$('#u').value=v;history.replaceState(null,'','#'+encodeURIComponent(v));check(v)}};
$('#go').onclick=run;$('#u').onkeydown=e=>{if(e.key==='Enter')run()};
const h0=decodeURIComponent(location.hash.slice(1));if(h0){$('#u').value=h0;check(h0)}
</script>
</body>
</html>
